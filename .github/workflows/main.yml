name: "Pack Mod"
on: workflow_dispatch

env:
  GODOT_VERSION: 4.7.2
  MOD_ID: co-op

jobs:
  export-linux:
    name: Package
    runs-on: ubuntu-24.04  # Use 24.04 with godot 4
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Create Project Folder
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/mods
          mkdir -p ${GITHUB_WORKSPACE}/build
          touch ${GITHUB_WORKSPACE}/project.godot
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          path: mods/${{env.MOD_ID}}
      - name: Set up Project
        run: |
          mv "mods/${MOD_ID}/mod.json" "build/mod.json"
          godot --headless --verbose --import "${GITHUB_WORKSPACE}"
      - name: Pack Mod
        run: |
          godot --headless --verbose --scene --quit "res://mods/${MOD_ID}/ci_mod_packer.tscn"
      - name: Upload release zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.MOD_ID}}.zip
          path: build
        
