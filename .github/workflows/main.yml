name: "Pack Mod"
on: workflow_dispatch

env:
  GODOT_VERSION: 4.7.2
  MOD_ID: co-op

jobs:
  export-linux:
    name: Package
    runs-on: ubuntu-24.04  # Use 24.04 with godot 4
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Create Project Folder
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/mods
          mkdir -p ${GITHUB_WORKSPACE}/build
          touch ${GITHUB_WORKSPACE}/project.godot
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          path: mods/mod
      - name: Set up Project
        run: |
          mv "${GITHUB_WORKSPACE}"/mods/mod/mod.json "${GITHUB_WORKSPACE}"/mod.json
          godot --headless --verbose --import "${GITHUB_WORKSPACE}"
      - name: Pack Mod
        run: |
          godot --headless --verbose --scene --quit "res://mods/mod/ci_mod_packer.tscn" "${GITHUB_WORKSPACE}"
      - name: Upload release zip
        uses: actions/upload-artifact@v7
        with:
          name: ${MOD_ID}.zip
          path: build
        
